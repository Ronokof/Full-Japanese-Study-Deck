<h4>Hint:</h4>
{{hint:Components}}

<h1 id="invalid-card" style="display:none;font-size:1.5em;text-align:center;"></h1>

<script>
    (function () {
        const data = document.getElementById('custom-data');
        const latestVersion = '10.2';

        // compatibility check
        // REMOVE AT YOUR OWN RISK
        if (data === null || data.dataset.custom !== latestVersion) {
            document.getElementById('invalid-card').textContent = `This note is not compatible with this version. If you wish to remove every incompatible note, search "-tag:fjsd_version::${latestVersion}" across the entire deck in the browser and delete everything that pops up.`;
            document.getElementById('invalid-card').style.removeProperty('display');
            document.body.replaceChildren(document.getElementById('invalid-card'));
            return;
        }
    })();
</script>
