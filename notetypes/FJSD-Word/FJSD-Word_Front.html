<h1 id="invalid-card" style="display:none;font-size:2em;text-align:center;"></h1>

<script>
  (function () {
    const data = document.getElementById('custom-data');

    // compatibility check
    // REMOVE AT YOUR OWN RISK
    if (data === null || data.dataset.custom !== '10.0.0') {
      document.getElementById('invalid-card').textContent = 'This card is not compatible with this version. Please delete or suspend this note/card!';
      document.getElementById('invalid-card').style.removeProperty('display');
      document.body.replaceChildren(document.getElementById('invalid-card'));
      return;
    }

    const kff = document.getElementById('kf').innerHTML;
    const rf = document.getElementById('r').innerHTML;
    const kfpos = document.getElementById('kf-pos').dataset.pos;
    const rpos = document.getElementById('r-pos').dataset.pos;

    if (kfpos === '1' && rpos === '2') {
      document.getElementById('f-div').innerHTML = kff;
      document.getElementById('f-h3').textContent = 'Kanji forms';
      document.getElementById('h-div').innerHTML = rf;
    } else if (rpos === '1' && kfpos === '2') {
      document.getElementById('f-div').innerHTML = rf;
      document.getElementById('f-h3').textContent = 'Readings';
      document.getElementById('h-div').innerHTML = kff;
    }
  })();
</script>
