<script>
(function () {
 const kff = document.getElementById('kf').innerHTML;
 const rf = document.getElementById('r').innerHTML;
 const raf = document.getElementById('r-a').innerHTML;
 const noaudio = document.getElementById('no-r-audio');
 const kfpos = document.getElementById('kf-pos').dataset.pos;
 const rpos = document.getElementById('r-pos').dataset.pos;

 if (kfpos === '1' && rpos === '2') {
  document.getElementById('f-div-1').innerHTML = kff;
  document.getElementById('f-h3-1').textContent = 'Kanji forms';
  document.getElementById('f-div-2').innerHTML = (noaudio === null) ? raf : rf;
  document.getElementById('f-h3-2').textContent = 'Readings';
} else if (rpos === '1' && kfpos === '2') {
  document.getElementById('f-div-1').innerHTML = (noaudio === null) ? raf : rf;
  document.getElementById('f-h3-1').textContent = 'Readings';
  document.getElementById('f-div-2').innerHTML = kff;
  document.getElementById('f-h3-2').textContent = 'Kanji forms';
}
})();
</script>
